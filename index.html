<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIM-Wissensdatenbank</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="theme-color" content="#1f5f8b">
<meta name="apple-mobile-web-app-title" content="AIM-Wissen">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: Suchfeld oben; Krankheitsbild-Seite mit Karteikarten; kompakte gruppierte Listen */
  --bg: #f5f6f7;
  --surface: #ffffff;
  --ink: #1b2228;
  --muted: #5d6973;
  --line: #e1e5e8;
  --accent: #1f5f8b;
  --accent-soft: #e6eff6;
  --track: #e9edf0;
  --c1: #3f9f74;
  --c2a: #e0b43a;
  --c2b: #e08a3c;
  --c3: #d9655c;
  --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181b; --surface: #1c2125; --ink: #e6eaed; --muted: #9aa6af; --line: #2d343a;
    --accent: #6fb0dc; --accent-soft: #1f2d38; --track: #2a3136; --c1: #4fb487; --c2a: #d9ae3c; --c2b: #e0904a; --c3: #e0786f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181b; --surface: #1c2125; --ink: #e6eaed; --muted: #9aa6af; --line: #2d343a;
  --accent: #6fb0dc; --accent-soft: #1f2d38; --track: #2a3136; --c1: #4fb487; --c2a: #d9ae3c; --c2b: #e0904a; --c3: #e0786f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px 64px; display: grid; gap: 16px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 20px; font-weight: 600; margin: 0; }
h1 a { color: inherit; text-decoration: none; }
.sub { color: var(--muted); font-size: 13px; }
#q { width: 100%; font: inherit; font-size: 17px; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
#q:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#out { display: grid; gap: 16px; }
.msg { font-size: 14px; color: var(--muted); margin: 0; }
.msg b { color: var(--ink); }
h2.fg { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 4px 0 0; }

/* Startseite */
.topics { display: grid; gap: 6px; }
.topic-link { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 11px 14px; }
.topic-link:hover { border-color: var(--accent); }
.topic-link b { font-weight: 600; }

/* Kacheln */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { font: inherit; text-align: left; display: grid; gap: 4px; align-content: start; min-height: 78px; padding: 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.tile b { font-weight: 600; font-size: 15px; line-height: 1.25; }
.tile span { font-size: 12.5px; color: var(--muted); }
.tile:hover { border-color: var(--accent); }
.tile[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.backbar { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; padding: 8px 0; background: var(--bg); }
.backbar button { font: inherit; font-size: 15px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.backbar .back { font-weight: 600; }

/* Fundstellen */
.hits { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 14px; }
.hit { display: block; padding: 8px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.hit:last-child { border-bottom: 0; }
.hit .path { font-size: 12px; color: var(--accent); display: block; }
.hit:hover .txt { text-decoration: underline; }

/* Krankheitsbild-Seite */
.page { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.page-head { padding: 14px 16px 10px; display: grid; gap: 6px; }
.page-head h2 { font-size: 20px; margin: 0; font-weight: 600; text-wrap: balance; }
.meta { font-size: 12px; color: var(--muted); display: flex; gap: 4px 12px; flex-wrap: wrap; }
.param { display: flex; align-items: center; gap: 8px; font-size: 14px; flex-wrap: wrap; }
.param input { width: 72px; font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font-family: var(--font-mono); }
.param button { font: inherit; font-size: 13px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }
.tabs { display: flex; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { font: inherit; font-size: 14px; white-space: nowrap; background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 10px 8px; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabs .n { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 3px; }
.content { padding: 6px 16px 16px; }
.grp { margin-top: 12px; }
.grp h3 { font-size: 14px; color: var(--accent); margin: 0 0 4px; font-weight: 600; }
.it { display: grid; grid-template-columns: minmax(150px, 30%) 1fr auto; gap: 2px 14px; padding: 7px 0; border-top: 1px solid var(--line); align-items: baseline; }
.it .ind { color: var(--muted); font-size: 14px; }
.it .mass { font-size: 14.5px; }
.it .note { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.it .side { display: flex; gap: 8px; align-items: center; justify-self: end; white-space: nowrap; }
.it.off { display: none; }
sup { color: var(--muted); font-size: 10px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
.bar { position: relative; width: 110px; height: 8px; background: var(--track); border-radius: 4px; }
.bar .fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.bar .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.badge { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; color: #1b2228; }
.k-I { background: var(--c1); } .k-IIa { background: var(--c2a); } .k-IIb { background: var(--c2b); } .k-III { background: var(--c3); }
.k-split { background: linear-gradient(var(--c1) 0 50%, var(--c2a) 50% 100%); }
.k-none { background: var(--accent); opacity: 0.55; }
.legend { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); margin-top: 10px; }
.see { margin-top: 14px; padding: 10px 12px; background: var(--accent-soft); border-radius: 8px; font-size: 14px; }
.see a { font-weight: 500; }
.hidden-info { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; }
ul.hints { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
figure.flow { margin: 6px 0 4px; display: grid; gap: 4px; }
figure.flow img { width: 100%; max-width: 820px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: zoom-in; }
figure.flow figcaption { font-size: 12px; color: var(--muted); }
dialog .cap a { color: #fff; }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 10px; }
.shots figure { margin: 0; display: grid; gap: 4px; }
.shots img { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; cursor: zoom-in; background: #fff; }
.shots figcaption { font-size: 12px; color: var(--muted); }
dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 94vh; }
dialog::backdrop { background: rgba(10, 14, 18, 0.85); }
dialog img { max-width: 96vw; max-height: 86vh; display: block; border-radius: 6px; background: #fff; }
dialog .cap { color: #fff; font-size: 13px; padding: 6px 2px; display: flex; justify-content: space-between; gap: 12px; }
dialog button { font: inherit; color: #fff; background: none; border: 1px solid #fff6; border-radius: 6px; padding: 2px 10px; cursor: pointer; }

@media (max-width: 640px) {
  .wrap { padding: 14px 10px 48px; gap: 12px; }
  #q { font-size: 16px; }
  .page-head { padding: 12px 12px 8px; }
  .page-head h2 { font-size: 18px; }
  .tabs { padding: 0 4px; flex-wrap: wrap; overflow-x: visible; }
  .tabs button { padding: 9px 8px 8px; font-size: 13.5px; }
  .content { padding: 4px 12px 14px; }
  .it { grid-template-columns: 1fr auto; grid-template-areas: "mass side" "ind ind"; gap: 1px 10px; }
  .it .mass { grid-area: mass; }
  .it .ind { grid-area: ind; font-size: 12.5px; }
  .it .side { grid-area: side; }
  .it .bar { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><a href="#" id="home">AIM-Wissensdatenbank</a></h1>
    <span class="sub" id="stats"></span>
  </header>
  <label for="q" class="sub">Krankheitsbild oder Massnahme suchen</label>
  <input id="q" type="search" autocomplete="off" placeholder="z. B. Herzinsuffizienz, SGLT2, Kardioversion">
  <div id="out" aria-live="polite"></div>
</div>

<dialog id="lb">
  <div class="cap"><span id="lbcap"></span><span><a id="lbfull" href="#" target="_blank" rel="noopener">Originalgrösse</a> <button type="button" id="lbclose">Schliessen</button></span></div>
  <img id="lbimg" alt="">
</dialog>

<script>
  // Inhalte immer frisch laden (GitHub Pages speichert Dateien sonst bis zu 10 Minuten zwischen)
  document.write('<script src="data.js?t=' + Date.now() + '"><\/script>');
</script>
<script>
(function () {
  const KB = window.KB || { themen: [], kapitel: [] };
  const KAP = KB.kapitel || ["Diagnostik", "Risiko/Klassifikation", "Prävention", "Therapie", "Spezielle Situationen", "Nachsorge"];
  const SLUG = { "Diagnostik": "diagnostik", "Risiko/Klassifikation": "risiko", "Therapie": "therapie", "Spezielle Situationen": "spezielle", "Nachsorge": "nachsorge", "Folien": "folien" };
  const UNSLUG = Object.fromEntries(Object.entries(SLUG).map(([k, v]) => [v, k]));
  const STOP = new Set(["therapie","leitlinie","leitlinien","leitlinientherapie","leitliniengerecht","behandlung","bei","mit","und","oder","der","die","das","den","dem","für","fuer","von","zu","was","welche","empfehlung","empfehlungen","guideline","guidelines","therapy","treatment","patient","patienten","the","of","in","im"]);
  const PARAM_ALIASES = { lvef: "LVEF", ef: "LVEF", grad: "Grad", grade: "Grad", ctcae: "Grad" };

  const $ = (s) => document.querySelector(s);
  const out = $("#out"), q = $("#q");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const norm = (s) => String(s ?? "").toLowerCase().replace(/-/g, "");
  const byId = (id) => KB.themen.find((t) => t.id === id);
  const hasRange = (e) => e.von != null && e.bis != null;

  $("#stats").textContent = KB.themen.length + " Krankheitsbilder · " + KB.themen.reduce((a, t) => a + t.eintraege.length, 0) + " Einträge";

  // ---------- Darstellung einzelner Elemente
  function badge(k) { return '<span class="badge ' + (k === "I/IIa" ? "k-split" : "k-" + k) + '">' + esc(k) + "</span>"; }
  function rangeText(t, e) {
    const p = t.parameter, u = p.einheit ? " " + p.einheit : "";
    if (e.bereichText) return p.name + " " + e.bereichText;
    if (e.von === e.bis) return p.name + " " + e.von + u;
    return p.name + " " + e.von + "–" + e.bis + u;
  }
  function bar(t, e, val) {
    const p = t.parameter; if (!p || !hasRange(e)) return "";
    const span = p.max - p.min, a = Math.max(e.von, p.min), b = Math.min(e.bis, p.max);
    const cls = !e.klasse ? "k-none" : e.klasse === "I/IIa" ? "k-split" : "k-" + e.klasse;
    const style = a === b ? "left:calc(" + ((a - p.min) / span) * 100 + "% - 4px);width:8px" : "left:" + ((a - p.min) / span) * 100 + "%;width:" + Math.max(((b - a) / span) * 100, 3) + "%";
    const m = val != null && val >= p.min && val <= p.max ? '<span class="mark" style="left:calc(' + ((val - p.min) / span) * 100 + '% - 1px)"></span>' : "";
    return '<span class="bar" aria-hidden="true"><span class="fill ' + cls + '" style="' + style + '"></span>' + m + "</span>";
  }
  function applies(t, e, val) { return val == null || !t.parameter || !hasRange(e) || (val >= e.von && val <= e.bis); }

  function figureBlock(t, e) {
    const s = t.screenshots[e.bild];
    return '<figure class="flow"><img src="' + esc(s.datei) + '" alt="' + esc(s.titel) + '" data-t="' + esc(t.id) + '" data-b="' + e.bild + '" loading="lazy"><figcaption>Antippen zum Vergrössern</figcaption></figure>';
  }

  function itemRow(t, e, val) {
    if (e.typ === "bild") return figureBlock(t, e);
    const side = (t.parameter && hasRange(e) ? bar(t, e, val) + '<span class="num">' + esc(rangeText(t, e)) + "</span>" : "") + (e.klasse ? badge(e.klasse) : "");
    return '<div class="it' + (applies(t, e, val) ? "" : " off") + '"><div class="ind">' + esc(e.indikation) + '</div><div class="mass">' + esc(e.massnahme) +
      (e.fussnote ? "<sup>" + esc(e.fussnote) + "</sup>" : "") + (e.notiz ? '<span class="note">' + esc(e.notiz) + "</span>" : "") +
      '</div><div class="side">' + side + "</div></div>";
  }

  // ---------- Krankheitsbild-Seite

  function tabsFor(t) {
    const list = KAP.filter((k) => t.eintraege.some((e) => e.kapitel === k) || (t.siehe || []).some((s) => s.kapitel === k));
    if (t.screenshots.length || (t.hinweise || []).length) list.push(t.screenshots.length ? "Folien" : "Quelle");
    return list;
  }

  function renderPage(id, kap, val) {
    const t = byId(id);
    if (!t) { renderHome(); return; }
    const tabs = tabsFor(t);
    if (!kap || !tabs.includes(kap)) kap = tabs[0];
    if (!t.parameter) val = null;
    cur.kap = kap; cur.val = val;
    const s = t.quelle || {};
    const p = t.parameter;
    let html = '<article class="page"><div class="page-head"><h2>' + esc(t.titel) + '</h2><div class="meta"><span>' + esc(t.fachgebiet) + "</span>" +
      (s.typ ? "<span>" + esc(s.typ) + "</span>" : "") + (s.stand ? "<span>Stand " + esc(s.stand) + "</span>" : "") + "</div>";
    if (p) {
      html += '<div class="param"><label for="pv">' + esc(p.name) + (p.einheit ? " (" + esc(p.einheit) + ")" : "") + '</label><input id="pv" type="number" inputmode="numeric" min="0" max="100" value="' + (val != null ? val : "") + '" placeholder="alle">' +
        (val != null ? '<button type="button" id="pvclear">alle anzeigen</button>' : "") + "</div>";
    }
    html += '</div><div class="tabs" role="tablist">' + tabs.map((k) => {
      const n = k === "Quelle" ? 0 : k === "Folien" ? t.screenshots.length : t.eintraege.filter((e) => e.kapitel === k && applies(t, e, val)).length;
      return '<button type="button" role="tab" data-kap="' + esc(k) + '" aria-selected="' + (k === kap) + '">' + esc(k) + (n ? '<span class="n">' + n + "</span>" : "") + "</button>";
    }).join("") + '</div><div class="content" role="tabpanel">' + renderKapitel(t, kap, val) + "</div></article>";
    out.innerHTML = backBar() + html;

    out.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => { cur.kap = b.dataset.kap; render(); }));
    const pv = $("#pv");
    if (pv) {
      pv.addEventListener("change", () => { cur.val = pv.value === "" ? null : +pv.value; render(); const n = $("#pv"); if (n) n.focus(); });
      const c = $("#pvclear"); if (c) c.addEventListener("click", () => { cur.val = null; render(); });
    }
  }

  function renderKapitel(t, kap, val) {
    if (kap === "Folien" || kap === "Quelle") {
      return (t.quelle && t.quelle.titel ? '<p class="msg" style="margin-top:10px">Quelle: ' + esc(t.quelle.titel) + "</p>" : "") +
        (t.hinweise && t.hinweise.length ? '<ul class="hints">' + t.hinweise.map((h) => "<li>" + esc(h) + "</li>").join("") + "</ul>" : "") +
        '<div class="shots">' + t.screenshots.map((s, i) => '<figure><img src="' + esc(s.datei) + '" alt="' + esc(s.titel) + '" data-t="' + esc(t.id) + '" data-b="' + i + '"><figcaption>' + esc(s.titel) + "</figcaption></figure>").join("") + "</div>";
    }
    const items = t.eintraege.filter((e) => e.kapitel === kap);
    const groups = [];
    items.forEach((e) => { let g = groups.find((x) => x.name === e.gruppe); if (!g) { g = { name: e.gruppe, items: [] }; groups.push(g); } g.items.push(e); });
    let html = groups.map((g) => {
      const shown = g.items.filter((e) => applies(t, e, val)).length;
      if (!shown) return "";
      return '<section class="grp"><h3>' + esc(g.name) + "</h3>" + g.items.map((e) => itemRow(t, e, val)).join("") + "</section>";
    }).join("");
    const hidden = items.filter((e) => !applies(t, e, val)).length;
    if (hidden) html += '<p class="hidden-info">' + hidden + " Einträge ausgeblendet, weil sie bei " + esc(t.parameter.name) + " " + val + " nicht gelten.</p>";
    const classes = ["I", "IIa", "IIb", "III", "I/IIa"].filter((k) => items.some((e) => e.klasse === k));
    if (classes.length) html += '<div class="legend">Empfehlungsklasse: ' + classes.map(badge).join("") + (classes.includes("I/IIa") ? " (zweifarbig auf der Folie)" : "") + "</div>";
    (t.siehe || []).filter((s) => s.kapitel === kap).forEach((s) => {
      const z = byId(s.ziel);
      if (z) html += '<div class="see">Siehe auch: <a href="#" data-open="' + esc(z.id) + '" data-kap="' + esc(s.zielKapitel) + '">' + esc(z.titel) + " › " + esc(s.zielKapitel) + "</a> – " + esc(s.text) + "</div>";
    });
    return html || '<p class="msg" style="margin-top:12px">Keine Einträge.</p>';
  }


  // ---------- Startseite
  function renderHome() {
    const groups = {};
    KB.themen.forEach((t) => { (groups[t.fachgebiet] = groups[t.fachgebiet] || []).push(t); });
    const names = Object.keys(groups).sort((a, b) => a.localeCompare(b, "de"));
    let html = '<h2 class="fg">Fachgebiete</h2><div class="tiles">' + names.map((g) =>
      '<button type="button" class="tile" data-fg="' + esc(g) + '" aria-expanded="' + (cur.fg === g) + '"><b>' + esc(g) + '</b><span>' + groups[g].length + (groups[g].length === 1 ? " Krankheitsbild" : " Krankheitsbilder") + "</span></button>").join("") + "</div>";
    if (cur.fg && groups[cur.fg]) {
      html += '<section class="topics"><h2 class="fg">' + esc(cur.fg) + "</h2>" + groups[cur.fg].sort((a, b) => a.titel.localeCompare(b.titel, "de")).map((t) =>
        '<a class="topic-link" href="#" data-open="' + esc(t.id) + '"><b>' + esc(t.titel) + '</b><span class="sub">' + tabsFor(t).filter((k) => k !== "Folien" && k !== "Quelle").join(" · ") + "</span></a>").join("") + "</section>";
    } else {
      html += '<p class="msg">Fachgebiet antippen, um die Krankheitsbilder zu sehen.</p>';
    }
    out.innerHTML = html;
    out.querySelectorAll(".tile").forEach((b) => b.addEventListener("click", () => { cur.fg = cur.fg === b.dataset.fg ? null : b.dataset.fg; render(); }));
  }

  // ---------- Suche
  function parse(str) {
    let s = norm(str);
    const params = {};
    s = s.replace(/\b(lvef|ef|grad|grade|ctcae)\s*(?:=|:|von|bei|<|>)?\s*(\d{1,3})\s*%?/g, (_, k, n) => { params[PARAM_ALIASES[k]] = +n; return " "; });
    let bare = null;
    s = s.replace(/\b(\d{1,3})\s*%?/g, (_, n) => { bare = +n; return " "; });
    const tokens = s.split(/[^a-zäöüéèàß0-9\/\-₂]+/i).filter((w) => w.length >= 2 && !STOP.has(w));
    return { params, bare, tokens };
  }
  const itemHay = (e) => norm([e.gruppe, e.indikation, e.massnahme, e.notiz, e.suchtext].join(" "));
  // Ein Wort öffnet ein Krankheitsbild nur, wenn es dessen Name oder ein Synonym ist (nicht bei Substanzen)
  function tokInTopic(tok, t) {
    const names = [norm(t.titel)].concat((t.synonyme || []).map(norm));
    return names.some((n) => n === tok || (n.length >= 4 && tok.includes(n)) || (tok.length >= 4 && n.split(/[\s()\/]+/).some((w) => w.startsWith(tok))));
  }

  function hitList(hits) {
    return '<div class="hits">' + hits.slice(0, 60).map(({ t, e }) =>
      '<a class="hit" href="#" data-open="' + esc(t.id) + '" data-kap="' + esc(e.kapitel) + '"><span class="path">' + esc(t.titel) + " › " + esc(e.kapitel) + " › " + esc(e.gruppe) + '</span><span class="txt">' +
      (e.typ === "bild" ? "Flowchart/Grafik: " + esc(e.massnahme) : (e.indikation && e.indikation !== "—" ? esc(e.indikation) + ": " : "") + esc(e.massnahme)) + "</span></a>").join("") + "</div>";
  }

  function renderSearch(str) {
    const { params, bare, tokens } = parse(str);
    if (!tokens.length) { out.innerHTML = backBar() + '<p class="msg">Suchbegriff eingeben.</p>'; return; }
    const topics = KB.themen.filter((t) => tokens.some((tok) => tokInTopic(tok, t)));
    const contentToks = tokens.filter((tok) => !topics.some((t) => tokInTopic(tok, t)));
    const unknown = tokens.filter((tok) => !KB.themen.some((t) => tokInTopic(tok, t) || t.eintraege.some((e) => itemHay(e).includes(tok))));

    // Genau ein Krankheitsbild genannt, sonst nichts: Seite direkt öffnen
    if (topics.length === 1 && !contentToks.length) {
      const t = topics[0];
      const fromQuery = t.parameter ? (params[t.parameter.name] != null ? params[t.parameter.name] : bare) : null;
      if (cur.id !== t.id) { cur.id = t.id; cur.kap = null; cur.val = undefined; }
      renderPage(t.id, cur.kap, cur.val !== undefined ? cur.val : fromQuery);
      const others = [];
      KB.themen.forEach((o) => { if (o !== t) o.eintraege.forEach((e) => { if (tokens.some((tok) => itemHay(e).includes(tok))) others.push({ t: o, e }); }); });
      if (others.length) out.insertAdjacentHTML("beforeend", '<h2 class="fg">Auch erwähnt in anderen Krankheitsbildern</h2>' + hitList(others));
      return;
    }

    let html = "";
    if (unknown.length) html += '<p class="msg">Nichts gefunden zu: <b>' + unknown.map(esc).join(", ") + "</b>.</p>";
    if (topics.length) {
      html += '<h2 class="fg">Krankheitsbilder</h2><div class="topics">' + topics.map((t) =>
        '<a class="topic-link" href="#" data-open="' + esc(t.id) + '"><b>' + esc(t.titel) + '</b><span class="sub">' + esc(t.fachgebiet) + "</span></a>").join("") + "</div>";
    }
    // Fundstellen: Einträge, die die Suchwörter enthalten (auch Krankheitsbild-Namen in anderen Themen)
    const findToks = contentToks.length ? contentToks : tokens;
    const hits = [];
    KB.themen.forEach((t) => {
      t.eintraege.forEach((e) => {
        if (findToks.every((tok) => itemHay(e).includes(tok) || (contentToks.length && tokInTopic(tok, t)))) {
          if (!contentToks.length && topics.includes(t)) return;
          hits.push({ t, e });
        }
      });
    });
    if (hits.length) {
      html += '<h2 class="fg">Fundstellen (' + hits.length + ")</h2>" + hitList(hits);
    }
    if (!html) html = '<p class="msg">Keine Einträge gefunden.</p>';
    out.innerHTML = backBar() + html;
  }

  // ---------- Navigation: eigener Verlauf, damit «Zurück» immer zur vorherigen Ansicht führt
  let cur = { type: "home", fg: null };
  const stack = [];

  function backBar() {
    return '<div class="backbar"><button type="button" class="back">← Zurück</button><button type="button" class="tohome">Übersicht</button></div>';
  }

  function render() {
    q.value = cur.type === "search" ? cur.q : "";
    if (cur.type === "page") renderPage(cur.id, cur.kap, cur.val);
    else if (cur.type === "search") renderSearch(cur.q);
    else renderHome();
    out.querySelectorAll(".back").forEach((b) => b.addEventListener("click", goBack));
    out.querySelectorAll(".tohome").forEach((b) => b.addEventListener("click", goHome));
  }

  function navigate(view) {
    stack.push(cur);
    cur = view;
    try { history.pushState({ d: stack.length }, "", location.pathname + "#" + (view.id || view.type)); } catch (e) {}
    render();
    window.scrollTo(0, 0);
  }
  function goBack() {
    if (stack.length) { try { history.back(); } catch (e) { popView(); } }
    else goHome();
  }
  function popView() {
    cur = stack.length ? stack.pop() : { type: "home", fg: null };
    render();
    window.scrollTo(0, 0);
  }
  function goHome() {
    const fg = cur.type === "page" && byId(cur.id) ? byId(cur.id).fachgebiet : null;
    stack.length = 0;
    cur = { type: "home", fg: fg };
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
    render();
    window.scrollTo(0, 0);
  }
  window.addEventListener("popstate", popView);

  out.addEventListener("click", (ev) => {
    const a = ev.target.closest("[data-open]");
    if (!a) return;
    ev.preventDefault();
    navigate({ type: "page", id: a.dataset.open, kap: a.dataset.kap || null, val: null });
  });

  const lb = $("#lb");
  out.addEventListener("click", (ev) => {
    const img = ev.target.closest("img[data-b]");
    if (!img) return;
    const t = byId(img.dataset.t), s = t && t.screenshots[+img.dataset.b];
    if (!s) return;
    $("#lbimg").src = s.datei; $("#lbimg").alt = s.titel; $("#lbfull").href = s.datei; $("#lbcap").textContent = t.titel + " · " + s.titel;
    try { lb.showModal(); } catch (e) { lb.setAttribute("open", ""); }
  });
  $("#lbclose").addEventListener("click", () => lb.close());
  lb.addEventListener("click", (ev) => { if (ev.target === lb) lb.close(); });

  let timer;
  q.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const v = q.value.trim();
      if (!v) { if (cur.type === "search") popView(); return; }
      if (cur.type === "search") { cur.q = q.value; render(); const pos = q.value.length; q.focus(); q.setSelectionRange(pos, pos); }
      else { navigate({ type: "search", q: q.value }); q.focus(); }
    }, 150);
  });
  $("#home").addEventListener("click", (ev) => { ev.preventDefault(); stack.length = 0; cur = { type: "home", fg: null }; try { history.replaceState(null, "", location.pathname); } catch (e) {} render(); });

  // Start immer auf der Übersicht
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  render();
})();
</script>
</body>
</html>
